<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بازی حافظه</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <style>
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Bold.woff2") format("woff2");
            font-weight: 700;
            font-display: swap;
        }
        :root {
            --bg: #0b1220;
            --bg2: #0f172a;
            --text: #e8eefc;
            --muted: #9fb0d0;
            --accent: #6ea8fe;
            --accent2: #8b5cf6;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 18px 50px rgba(0, 0, 0, .45);
            --glass: blur(14px);
            --radius: 24px;
            --card-bg: rgba(255, 255, 255, .04);
            --bg-light: #eef2f7;
            --bg2-light: #d5dee8;
            --text-light: #1a202c;
            --muted-light: #5a6a7e;
            --border-light: rgba(0, 0, 0, .1);
            --shadow-light: 0 10px 30px rgba(0, 0, 0, .08);
            --success: #4ade80;
            --danger: #f87171;
            --warning: #fbbf24;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: VazirmatnLocal, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top left, rgba(110, 168, 254, .2), transparent 28%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, .18), transparent 34%);
            background-attachment: fixed;
            color: var(--text);
            transition: all .3s;
            padding: 20px;
        }
        body.light-mode {
            background: var(--bg-light);
            background-image: radial-gradient(circle at top left, rgba(110, 168, 254, .08), transparent 28%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, .06), transparent 34%);
        }
        .container {
            width: min(800px, 100%);
            margin: auto;
            position: relative;
        }
        .panel {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
            border: 1px solid var(--border);
            backdrop-filter: var(--glass);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 32px;
            transition: all .3s;
        }
        body.light-mode .panel {
            background: rgba(255, 255, 255, .75);
            border-color: rgba(0, 0, 0, .08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .06);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            transition: all .3s;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, .04);
        }
        body.light-mode .back-link {
            background: rgba(0, 0, 0, .04);
            border-color: rgba(0, 0, 0, .08);
            color: var(--muted-light);
        }
        .back-link:hover {
            border-color: var(--accent);
            color: var(--text);
            transform: translateX(-4px);
        }
        body.light-mode .back-link:hover {
            color: var(--text-light);
        }
        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .game-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .game-icon {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(110, 168, 254, .28), rgba(139, 92, 246, .24));
            border: 1px solid rgba(255, 255, 255, .1);
            font-size: 26px;
            color: var(--accent);
            flex-shrink: 0;
        }
        body.light-mode .game-icon {
            background: linear-gradient(135deg, rgba(110, 168, 254, .15), rgba(139, 92, 246, .1));
            border-color: rgba(0, 0, 0, .06);
        }
        .game-title h1 {
            font-size: 22px;
            margin: 0;
        }
        .game-title p {
            color: var(--muted);
            font-size: 13px;
            margin: 2px 0 0;
        }
        body.light-mode .game-title p {
            color: var(--muted-light);
        }
        .stats {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 20px;
            flex-wrap: wrap;
        }
        body.light-mode .stats {
            background: rgba(0, 0, 0, .04);
            border-color: rgba(0, 0, 0, .06);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .label {
            font-size: 11px;
            color: var(--muted);
        }
        body.light-mode .stat-item .label {
            color: var(--muted-light);
        }
        .stat-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }
        .game-board {
            display: grid;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }
        .game-board.size-4x4 {
            grid-template-columns: repeat(4, 1fr);
            max-width: 480px;
            margin: 20px auto;
        }
        .game-board.size-6x6 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 480px;
            margin: 20px auto;
        }
        .game-board.size-8x8 {
            grid-template-columns: repeat(8, 1fr);
            max-width: 560px;
            margin: 20px auto;
        }
        .card-memory {
            aspect-ratio: 1;
            border-radius: 14px;
            cursor: pointer;
            perspective: 600px;
            position: relative;
            transition: transform .15s;
            min-width: 40px;
        }
        .card-memory:hover:not(.matched):not(.disabled) {
            transform: scale(1.03);
        }
        .card-memory.disabled {
            cursor: default;
        }
        .card-memory .inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 14px;
        }
        .card-memory.flipped .inner {
            transform: rotateY(180deg);
        }
        .card-memory.matched .inner {
            transform: rotateY(180deg);
        }
        .card-memory.matched {
            cursor: default;
            animation: matchPulse 0.5s ease;
        }
        .card-memory.matched .front {
            border-color: var(--success);
            box-shadow: 0 0 25px rgba(74, 222, 128, .25);
        }
        .card-memory .front,
        .card-memory .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
            transition: all .3s;
        }
        body.light-mode .card-memory .front,
        body.light-mode .card-memory .back {
            border-color: rgba(0, 0, 0, .08);
        }
        .card-memory .back {
            background: linear-gradient(135deg, rgba(110, 168, 254, .15), rgba(139, 92, 246, .12));
            transform: rotateY(0deg);
            font-size: 28px;
            color: var(--accent);
        }
        body.light-mode .card-memory .back {
            background: linear-gradient(135deg, rgba(110, 168, 254, .08), rgba(139, 92, 246, .06));
        }
        .card-memory .back i {
            font-size: 32px;
        }
        .card-memory .front {
            background: rgba(255, 255, 255, .05);
            transform: rotateY(180deg);
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
        }
        body.light-mode .card-memory .front {
            background: rgba(255, 255, 255, .7);
            color: var(--text-light);
        }
        .card-memory .front i {
            font-size: 32px;
            color: var(--accent);
        }
        @keyframes matchPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }
        .game-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }
        .game-btn {
            padding: 10px 24px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .04);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all .3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        body.light-mode .game-btn {
            background: rgba(0, 0, 0, .04);
            border-color: rgba(0, 0, 0, .08);
            color: var(--text-light);
        }
        .game-btn:hover:not(:disabled) {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .game-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
        }
        .game-btn.primary:hover:not(:disabled) {
            box-shadow: 0 8px 24px rgba(110, 168, 254, .3);
        }
        .game-btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none !important;
        }
        .size-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .size-selector label {
            font-size: 13px;
            color: var(--muted);
        }
        body.light-mode .size-selector label {
            color: var(--muted-light);
        }
        .size-selector select {
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        body.light-mode .size-selector select {
            background: rgba(255, 255, 255, .8);
            border-color: rgba(0, 0, 0, .08);
            color: var(--text-light);
        }
        .win-overlay {
            display: none;
            text-align: center;
            padding: 30px 20px;
            animation: fadeUp .5s ease both;
        }
        .win-overlay.show {
            display: block;
        }
        .win-overlay .big-icon {
            font-size: 64px;
            color: var(--success);
            margin-bottom: 12px;
        }
        .win-overlay h2 {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .win-overlay p {
            color: var(--muted);
            font-size: 16px;
        }
        body.light-mode .win-overlay p {
            color: var(--muted-light);
        }
        .theme-switcher {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            backdrop-filter: var(--glass);
            color: var(--text);
            cursor: pointer;
            font-size: 20px;
            display: grid;
            place-items: center;
            transition: all .3s;
            z-index: 100;
        }
        body.light-mode .theme-switcher {
            background: rgba(255, 255, 255, .7);
            border-color: rgba(0, 0, 0, .08);
            color: var(--text-light);
        }
        .theme-switcher:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 15px;
            z-index: 99999;
            opacity: 0;
            transition: all .4s cubic-bezier(.2, .8, .2, 1);
            border: 1px solid rgba(255, 255, 255, .1);
            pointer-events: none;
            text-align: center;
            max-width: 90%;
            font-family: VazirmatnLocal, sans-serif;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media(max-width: 600px) {
            .panel {
                padding: 16px;
                border-radius: 20px;
            }
            .game-header {
                flex-direction: column;
                align-items: stretch;
            }
            .game-title h1 {
                font-size: 18px;
            }
            .stats {
                justify-content: center;
                padding: 8px 14px;
                gap: 14px;
            }
            .stat-item .value {
                font-size: 16px;
            }
            .game-board.size-4x4,
            .game-board.size-6x6,
            .game-board.size-8x8 {
                gap: 6px;
                max-width: 100%;
            }
            .card-memory .front i,
            .card-memory .back i {
                font-size: 22px;
            }
            .game-controls {
                flex-direction: column;
                align-items: center;
            }
            .size-selector {
                width: 100%;
                justify-content: center;
            }
            .theme-switcher {
                bottom: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="panel">
            <a href="index.html" class="back-link"><i class="fa fa-arrow-right"></i> بازگشت به لانچر</a>

            <div class="game-header">
                <div class="game-title">
                    <div class="game-icon"><i class="fa fa-brain"></i></div>
                    <div>
                        <h1>بازی حافظه</h1>
                        <p>کارت‌ها را به خاطر بسپارید و جفت‌های مشابه را پیدا کنید!</p>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="label">تلاش</div>
                        <div class="value" id="moves">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">تطابق</div>
                        <div class="value" id="matches">0/0</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">زمان</div>
                        <div class="value" id="timer">0s</div>
                    </div>
                </div>
            </div>

            <div class="game-board size-6x6" id="gameBoard"></div>

            <div class="win-overlay" id="winOverlay">
                <div class="big-icon"><i class="fa fa-trophy"></i></div>
                <h2>🎉 برنده شدید!</h2>
                <p id="winMessage">همه کارت‌ها را پیدا کردید!</p>
            </div>

            <div class="game-controls">
                <div class="size-selector">
                    <label>اندازه:</label>
                    <select id="boardSize">
                        <option value="4">4×4 (ساده)</option>
                        <option value="6" selected>6×6 (متوسط)</option>
                        <option value="8">8×8 (حرفه‌ای)</option>
                    </select>
                </div>
                <button class="game-btn primary" onclick="startGame()"><i class="fa fa-play"></i> شروع جدید</button>
            </div>
        </section>
    </div>

    <button class="theme-switcher" onclick="toggleTheme()" aria-label="تغییر تم">
        <i class="fa fa-moon" id="themeIcon"></i>
    </button>

    <div class="toast" id="toast"></div>

    <script>
        // ========== Theme ==========
        function getTheme() {
            return localStorage.getItem('sa-apps-theme') || 'dark';
        }

        function applyTheme(theme) {
            document.body.classList.toggle('light-mode', theme === 'light');
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.className = theme === 'light' ? 'fa fa-sun' : 'fa fa-moon';
            }
            localStorage.setItem('sa-apps-theme', theme);
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            applyTheme(isLight ? 'light' : 'dark');
        }

        // ========== Toast ==========
        let toastTimer;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ========== Game Logic ==========
        const icons = [
            'fa-star', 'fa-heart', 'fa-cloud', 'fa-sun', 'fa-moon', 'fa-leaf',
            'fa-snowflake', 'fa-bolt', 'fa-fire', 'fa-droplet', 'fa-crown', 'fa-gem',
            'fa-rocket', 'fa-car', 'fa-plane', 'fa-anchor', 'fa-bicycle', 'fa-camera',
            'fa-music', 'fa-palette', 'fa-robot', 'fa-rocket', 'fa-spider', 'fa-tree',
            'fa-cat', 'fa-dog', 'fa-fish', 'fa-kiwi-bird', 'fa-crow', 'fa-dove'
        ];

        let gameState = {
            cards: [],
            flipped: [],
            matched: 0,
            moves: 0,
            isLocked: false,
            timer: 0,
            timerInterval: null,
            size: 6,
            totalPairs: 18,
            isRunning: false,
            isRevealing: false
        };

        function startGame() {
            // Stop timer
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }

            const size = parseInt(document.getElementById('boardSize').value);
            gameState.size = size;
            gameState.totalPairs = (size * size) / 2;
            gameState.matched = 0;
            gameState.moves = 0;
            gameState.flipped = [];
            gameState.isLocked = true;
            gameState.timer = 0;
            gameState.isRunning = false;
            gameState.isRevealing = true;

            document.getElementById('winOverlay').classList.remove('show');

            // Select icons
            const selectedIcons = shuffleArray([...icons]).slice(0, gameState.totalPairs);
            const pairs = [...selectedIcons, ...selectedIcons];
            gameState.cards = shuffleArray(pairs).map((icon, index) => ({
                id: index,
                icon: icon,
                isFlipped: false,
                isMatched: false
            }));

            renderBoard();
            updateStats();

            // Show all cards for 2.5 seconds
            showToast('🔍 کارت‌ها را به خاطر بسپارید...');
            
            // Flip all cards up
            gameState.cards.forEach((card, i) => {
                card.isFlipped = true;
                const el = document.querySelector(`.card-memory[data-index="${i}"]`);
                if (el) el.classList.add('flipped');
            });

            // After 2.5 seconds, flip them back
            setTimeout(() => {
                gameState.cards.forEach((card, i) => {
                    card.isFlipped = false;
                    const el = document.querySelector(`.card-memory[data-index="${i}"]`);
                    if (el) el.classList.remove('flipped');
                });
                gameState.isLocked = false;
                gameState.isRevealing = false;
                gameState.isRunning = true;
                gameState.timerInterval = setInterval(() => {
                    gameState.timer++;
                    updateStats();
                }, 1000);
                showToast('🎯 شروع بازی! کارت‌های مشابه را پیدا کنید');
            }, 2500);
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            const size = gameState.size;
            board.className = 'game-board size-' + size + 'x' + size;

            board.innerHTML = '';
            gameState.cards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card-memory';
                div.dataset.index = index;
                if (card.isFlipped) div.classList.add('flipped');
                if (card.isMatched) div.classList.add('matched');
                if (gameState.isLocked || gameState.isRevealing) div.classList.add('disabled');

                div.innerHTML = `
                    <div class="inner">
                        <div class="back"><i class="fa fa-question"></i></div>
                        <div class="front"><i class="fa ${card.icon}"></i></div>
                    </div>
                `;
                div.addEventListener('click', () => flipCard(index));
                board.appendChild(div);
            });
        }

        function flipCard(index) {
            if (gameState.isLocked || gameState.isRevealing) return;
            const card = gameState.cards[index];
            if (card.isFlipped || card.isMatched) return;

            // Start timer on first flip (if not started already)
            if (!gameState.isRunning) {
                gameState.isRunning = true;
                gameState.timerInterval = setInterval(() => {
                    gameState.timer++;
                    updateStats();
                }, 1000);
            }

            // Flip the card
            card.isFlipped = true;
            const el = document.querySelector(`.card-memory[data-index="${index}"]`);
            el.classList.add('flipped');

            gameState.flipped.push(index);

            if (gameState.flipped.length === 2) {
                gameState.moves++;
                gameState.isLocked = true;
                updateStats();

                const idx1 = gameState.flipped[0];
                const idx2 = gameState.flipped[1];
                const card1 = gameState.cards[idx1];
                const card2 = gameState.cards[idx2];

                if (card1.icon === card2.icon && idx1 !== idx2) {
                    // Match!
                    card1.isMatched = true;
                    card2.isMatched = true;
                    gameState.matched++;
                    gameState.flipped = [];
                    gameState.isLocked = false;

                    const el1 = document.querySelector(`.card-memory[data-index="${idx1}"]`);
                    const el2 = document.querySelector(`.card-memory[data-index="${idx2}"]`);
                    el1.classList.add('matched');
                    el2.classList.add('matched');

                    updateStats();

                    if (gameState.matched === gameState.totalPairs) {
                        // Win!
                        clearInterval(gameState.timerInterval);
                        gameState.timerInterval = null;
                        gameState.isRunning = false;
                        document.getElementById('winMessage').textContent =
                            `🎯 ${gameState.moves} تلاش در ${gameState.timer} ثانیه!`;
                        document.getElementById('winOverlay').classList.add('show');
                        showToast('🎉 تبریک! برنده شدید!');
                    }
                } else {
                    // No match - flip back after delay
                    setTimeout(() => {
                        card1.isFlipped = false;
                        card2.isFlipped = false;
                        const el1 = document.querySelector(`.card-memory[data-index="${idx1}"]`);
                        const el2 = document.querySelector(`.card-memory[data-index="${idx2}"]`);
                        el1.classList.remove('flipped');
                        el2.classList.remove('flipped');
                        gameState.flipped = [];
                        gameState.isLocked = false;
                    }, 700);
                }
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = gameState.moves;
            document.getElementById('matches').textContent = gameState.matched + '/' + gameState.totalPairs;
            document.getElementById('timer').textContent = gameState.timer + 's';
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ========== Init ==========
        applyTheme(getTheme());
        startGame();
    </script>
</body>
