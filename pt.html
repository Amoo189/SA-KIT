<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جدول تناوبی حرفه‌ای SA</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css" />
    <style>
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Bold.woff2") format("woff2");
            font-weight: 700;
            font-display: swap;
        }

        :root {
            --bg: #080c18;
            --bg2: #0f1a2e;
            --text: #e8eefc;
            --muted: #7a93b8;
            --accent: #60a5fa;
            --accent2: #8b5cf6;
            --border: rgba(255, 255, 255, .05);
            --shadow: 0 20px 60px rgba(0, 0, 0, .7);
            --glass: blur(18px);
            --radius: 24px;
            --card-bg: rgba(255, 255, 255, .02);
            --glow: #60a5fa;

            --bg-light: #eef2f7;
            --bg2-light: #d5dee8;
            --text-light: #0a121f;
            --muted-light: #4a5a7a;
            --border-light: rgba(0, 0, 0, .06);
            --shadow-light: 0 10px 30px rgba(0, 0, 0, .05);
            --card-bg-light: rgba(255, 255, 255, .7);

            --alkali: #ff4757;
            --alkaline: #ff6b35;
            --transition: #f9ca24;
            --post-transition: #f0932b;
            --metalloid: #6ab04c;
            --nonmetal: #1e90ff;
            --halogen: #a29bfe;
            --noble: #00d2d3;
            --lanthanide: #fd79a8;
            --actinide: #e17055;
            --unknown: #636e72;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg2: var(--bg2-light);
            --text: var(--text-light);
            --muted: var(--muted-light);
            --border: var(--border-light);
            --shadow: var(--shadow-light);
            --card-bg: var(--card-bg-light);
            --glow: #1e6f9f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: VazirmatnLocal, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(96, 165, 250, .10), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, .08), transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(96, 165, 250, .03), transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            transition: all .4s;
            padding: 16px;
        }

        body.light-mode {
            background: var(--bg-light);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(96, 165, 250, .05), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, .03), transparent 30%);
        }

        .container {
            max-width: 1340px;
            margin: 0 auto;
            position: relative;
        }

        .panel {
            position: relative;
            z-index: 1;
            background: linear-gradient(165deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 28px 32px;
            transition: all .4s;
        }
        body.light-mode .panel {
            background: rgba(255, 255, 255, .7);
            border-color: rgba(0, 0, 0, .04);
            box-shadow: var(--shadow-light);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .brand-badge {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(96, 165, 250, .3), rgba(139, 92, 246, .25));
            border: 1px solid rgba(255, 255, 255, .06);
            font-weight: 800;
            font-size: 22px;
            box-shadow: 0 10px 40px rgba(96, 165, 250, .12);
            flex-shrink: 0;
            transition: all .3s;
            color: var(--text);
        }
        .brand-badge:hover {
            transform: scale(1.05) rotate(-5deg);
        }
        body.light-mode .brand-badge {
            background: linear-gradient(135deg, rgba(96, 165, 250, .15), rgba(139, 92, 246, .10));
            border-color: rgba(0, 0, 0, .04);
        }
        .brand-title h1 {
            margin: 0;
            font-size: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            width: 220px;
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .03);
            backdrop-filter: var(--glass);
            border-radius: 14px;
            color: var(--text);
            font-size: 14px;
            transition: all .35s;
            font-family: inherit;
        }
        .search-input::placeholder {
            color: var(--muted);
        }
        body.light-mode .search-input {
            background: rgba(255, 255, 255, .8);
            border-color: rgba(0, 0, 0, .06);
            color: var(--text-light);
        }
        .search-input:focus {
            width: 280px;
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(96, 165, 250, .06);
            background: rgba(255, 255, 255, .05);
        }
        body.light-mode .search-input:focus {
            background: rgba(255, 255, 255, .95);
            box-shadow: 0 0 30px rgba(96, 165, 250, .04);
        }

        .theme-btn,
        .back-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .03);
            backdrop-filter: var(--glass);
            color: var(--text);
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            padding: 10px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        body.light-mode .theme-btn,
        body.light-mode .back-btn {
            background: rgba(255, 255, 255, .7);
            border-color: rgba(0, 0, 0, .04);
            color: var(--text-light);
        }
        .theme-btn:hover,
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
            border-color: var(--accent);
            background: rgba(96, 165, 250, .06);
        }
        body.light-mode .theme-btn:hover,
        body.light-mode .back-btn:hover {
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .04);
        }
        .theme-btn .icon {
            width: 20px;
            height: 20px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            justify-content: center;
            margin-bottom: 20px;
            padding: 12px 18px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            direction: rtl;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--muted);
            transition: all .2s;
            cursor: default;
        }
        .legend-item:hover {
            color: var(--text);
            transform: scale(1.05);
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, .08);
            flex-shrink: 0;
            transition: all .3s;
        }
        .legend-item:hover .legend-color {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, .06);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0;
            direction: ltr;
        }

        #table {
            display: grid;
            grid-template-columns: repeat(18, 64px);
            gap: 4px;
            padding: 6px 0;
            width: max-content;
            margin: 0 auto;
        }

        .element {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 3px 1px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border);
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all .3s cubic-bezier(.2, .8, .2, 1);
            position: relative;
            user-select: none;
        }
        .element::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 13px;
            opacity: 0;
            transition: all .4s;
            background: linear-gradient(135deg, rgba(255, 255, 255, .06), transparent);
            pointer-events: none;
        }
        .element:hover::after {
            opacity: 1;
        }
        .element:hover {
            transform: scale(1.12) translateY(-4px);
            z-index: 3;
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(96, 165, 250, .25);
        }
        body.light-mode .element:hover {
            box-shadow: 0 10px 40px rgba(96, 165, 250, .10);
        }
        .element .symbol {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.1;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .3);
            position: relative;
            z-index: 1;
        }
        .element .number {
            font-size: 8px;
            opacity: .85;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .2);
            position: relative;
            z-index: 1;
        }
        .element .name,
        .element .mass {
            display: none;
        }

        .alkali {
            background: var(--alkali);
            border-color: var(--alkali);
        }
        .alkaline {
            background: var(--alkaline);
            border-color: var(--alkaline);
        }
        .transition {
            background: var(--transition);
            border-color: var(--transition);
        }
        .post-transition {
            background: var(--post-transition);
            border-color: var(--post-transition);
        }
        .metalloid {
            background: var(--metalloid);
            border-color: var(--metalloid);
        }
        .nonmetal {
            background: var(--nonmetal);
            border-color: var(--nonmetal);
        }
        .halogen {
            background: var(--halogen);
            border-color: var(--halogen);
        }
        .noble {
            background: var(--noble);
            border-color: var(--noble);
        }
        .lanthanide {
            background: var(--lanthanide);
            border-color: var(--lanthanide);
        }
        .actinide {
            background: var(--actinide);
            border-color: var(--actinide);
        }
        .unknown {
            background: var(--unknown);
            border-color: var(--unknown);
        }

        #fblock {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            direction: ltr;
        }
        .fblock-label {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
            direction: rtl;
            padding: 5px 14px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .fblock-label i {
            color: var(--accent);
        }
        .frow {
            display: grid;
            grid-template-columns: repeat(15, 64px);
            gap: 4px;
            width: max-content;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        #overlay.show {
            display: flex;
            animation: overlayFade .4s ease;
        }
        @keyframes overlayFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        #focus {
            width: 95%;
            max-width: 580px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px 36px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .7);
            position: relative;
            animation: focusPop .5s cubic-bezier(.2, .8, .2, 1);
            direction: rtl;
        }
        body.light-mode #focus {
            background: var(--bg-light);
        }
        @keyframes focusPop {
            from {
                opacity: 0;
                transform: scale(.92) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #close {
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            transition: all .3s;
            background: none;
            border: none;
            font-family: inherit;
            padding: 6px 10px;
            border-radius: 50%;
            line-height: 1;
        }
        #close:hover {
            color: #ff4757;
            transform: rotate(90deg) scale(1.1);
            background: rgba(255, 71, 87, .06);
        }

        #content {
            direction: rtl;
            text-align: right;
            font-size: 14px;
            padding-top: 4px;
        }
        #content .bigSymbol {
            font-size: 62px;
            font-weight: 800;
            color: var(--glow);
            text-align: center;
            line-height: 1.1;
            letter-spacing: 2px;
            text-shadow: 0 0 60px rgba(96, 165, 250, .12);
        }
        #content .bigName {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
        }
        #content .bigNameEn {
            font-size: 16px;
            text-align: center;
            color: var(--muted);
            margin-bottom: 14px;
            font-weight: 400;
        }
        #content .bigNumber {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        #content .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 16px;
            margin-top: 4px;
        }
        #content .info {
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
        }
        #content .info.full {
            grid-column: 1 / -1;
        }
        #content .info .label {
            opacity: .7;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #content .info .label i {
            font-size: 11px;
            width: 14px;
            text-align: center;
        }
        #content .info .value {
            font-weight: 600;
            font-size: 13px;
            text-align: left;
            direction: ltr;
            display: inline-block;
        }
        #content .info .value.fa {
            direction: rtl;
        }

        #atomCanvas {
            display: block;
            margin: 18px auto 0;
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 165, 250, .04), transparent 70%);
        }

        .back-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            padding: 15px 19px;
            border-radius: 50%;
            background: rgba(96, 165, 250, .12);
            border: 1px solid rgba(96, 165, 250, .2);
            color: var(--text);
            cursor: pointer;
            font-size: 20px;
            transition: all .4s cubic-bezier(.2, .8, .2, 1);
            opacity: 0;
            transform: translateY(30px) scale(.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .back-top-btn.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .back-top-btn:hover {
            transform: translateY(-6px) scale(1.08);
            background: rgba(96, 165, 250, .22);
            box-shadow: 0 12px 40px rgba(96, 165, 250, .15);
        }
        body.light-mode .back-top-btn {
            background: rgba(96, 165, 250, .08);
            border-color: rgba(96, 165, 250, .12);
            color: var(--text-light);
        }
        body.light-mode .back-top-btn:hover {
            background: rgba(96, 165, 250, .16);
            box-shadow: 0 12px 40px rgba(96, 165, 250, .06);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        @media (max-width: 860px) {
            .panel {
                padding: 16px;
            }
            #table {
                grid-template-columns: repeat(18, 48px);
                gap: 3px;
            }
            .frow {
                grid-template-columns: repeat(15, 48px);
                gap: 3px;
            }
            .element {
                min-height: 48px;
                border-radius: 8px;
                padding: 2px 0;
            }
            .element .symbol {
                font-size: 15px;
            }
            .element .number {
                font-size: 7px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .topbar-left {
                justify-content: center;
            }
            .topbar-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            .search-input {
                width: 100%;
                max-width: 300px;
            }
            .search-input:focus {
                width: 100%;
            }
            #focus {
                padding: 20px 22px;
                max-width: 100%;
            }
            #content .bigSymbol {
                font-size: 44px;
            }
            #content .bigName {
                font-size: 20px;
            }
            #content .info-grid {
                grid-template-columns: 1fr;
            }
            .legend {
                gap: 4px 8px;
                padding: 8px 12px;
            }
            .legend-item {
                font-size: 10px;
            }
            .legend-color {
                width: 13px;
                height: 13px;
            }
        }

        @media (max-width: 520px) {
            #table {
                grid-template-columns: repeat(18, 36px);
                gap: 2px;
            }
            .frow {
                grid-template-columns: repeat(15, 36px);
                gap: 2px;
            }
            .element {
                min-height: 38px;
                border-radius: 6px;
                padding: 1px 0;
            }
            .element .symbol {
                font-size: 12px;
            }
            .element .number {
                font-size: 6px;
            }
            .brand-title h1 {
                font-size: 17px;
            }
            .brand-badge {
                width: 44px;
                height: 44px;
                font-size: 16px;
                border-radius: 12px;
            }
            .theme-btn,
            .back-btn {
                padding: 7px 10px;
                font-size: 12px;
                border-radius: 10px;
            }
            .back-top-btn {
                bottom: 18px;
                right: 18px;
                padding: 11px 15px;
                font-size: 15px;
            }
            #focus {
                padding: 16px 18px;
                border-radius: 18px;
            }
            #content .bigSymbol {
                font-size: 36px;
            }
            #content .bigName {
                font-size: 17px;
            }
            #content .bigNameEn {
                font-size: 13px;
            }
            #content .info .label {
                font-size: 11px;
            }
            #content .info .value {
                font-size: 12px;
            }
            .fblock-label {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">

            <div class="topbar">
                <div class="topbar-left">
                    <div class="brand-badge">⚛</div>
                    <div class="brand-title">
                        <h1>جدول تناوبی</h1>
                        <p>۱۱۸ عنصر • نمایش اتمی پیشرفته</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 جستجو عنصر..." autocomplete="off" />
                    <button class="theme-btn" onclick="toggleTheme()" aria-label="تغییر تم">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                            <path d="M12 2.5V5.5M12 18.5V21.5M5.5 12H2.5M21.5 12H18.5M18.364 5.636l-2 2M7.636 16.364l-2 2M16.364 16.364l2 2M5.636 5.636l2 2"/>
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                    </button>
                    <button class="back-btn" onclick="location.href='index.html'" title="بازگشت به صفحه اصلی">
                        <i class="fa fa-arrow-left"></i>
                    </button>
                </div>
            </div>

            <div class="legend">
                <span class="legend-item"><span class="legend-color" style="background:var(--alkali)"></span> قلیایی</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--alkaline)"></span> قلیایی خاکی</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--transition)"></span> فلز واسطه</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--post-transition)"></span> پس‌واسطه</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--metalloid)"></span> شبه‌فلز</span>

        // ===== ساخت جدول =====
        const tableEl = document.getElementById('table');
        const lanEl = document.getElementById('lan');
        const actEl = document.getElementById('act');

        function createElementCard(el) {
            const div = document.createElement('div');
            div.className = `element ${el.category}`;
            div.setAttribute('data-number', el.number);
            div.setAttribute('data-symbol', el.symbol);
            div.setAttribute('data-name', el.name);
            div.innerHTML = `
                <div class="number">${el.number}</div>
                <div class="symbol">${el.symbol}</div>
                <div class="name">${el.name}</div>
                <div class="mass">${el.atomic_mass}</div>
            `;
            div.onclick = () => focusElement(el);
            return div;
        }

        elements.forEach(el => {
            if (el.number >= 57 && el.number <= 71) {
                lanEl.appendChild(createElementCard(el));
            } else if (el.number >= 89 && el.number <= 103) {
                actEl.appendChild(createElementCard(el));
            } else {
                const card = createElementCard(el);
                card.style.gridColumn = el.group;
                card.style.gridRow = el.period;
                tableEl.appendChild(card);
            }
        });

        // ===== جستجو =====
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            document.querySelectorAll('.element').forEach(el => {
                const text = el.textContent.toLowerCase();
                const show = text.includes(q);
                el.style.display = show ? '' : 'none';
            });
        });

        // ===== تم =====
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // ===== اورلی اطلاعات =====
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('content');
        const closeBtn = document.getElementById('close');

        function focusElement(el) {
            overlay.classList.add('show');
            const mass = el.atomic_mass;
            const eneg = el.electronegativity !== null ? el.electronegativity : '—';
            const radius = el.atomic_radius !== '—' ? el.atomic_radius : '—';
            const catFa = {
                alkali: 'قلیایی',
                alkaline: 'قلیایی خاکی',
                transition: 'فلز واسطه',
                'post-transition': 'پس‌واسطه',
                metalloid: 'شبه‌فلز',
                nonmetal: 'نافلز',
                halogen: 'هالوژن',
                noble: 'گاز نجیب',
                lanthanide: 'لانتانید',
                actinide: 'اکتینید',
                unknown: 'ناشناخته'
            } [el.category] || el.category;

            content.innerHTML = `
                <div class="bigSymbol" style="color:${el.color || 'var(--glow)'}">${el.symbol}</div>
                <div class="bigName">${el.name}</div>
                <div class="bigNameEn">${el.nameEn}</div>
                <div class="bigNumber">عدد اتمی ${el.number} • جرم ${mass}</div>
                <div class="info-grid">
                    <div class="info"><span class="label"><i class="fa fa-hashtag"></i> عدد اتمی</span><span class="value">${el.number}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-weight-scale"></i> جرم اتمی</span><span class="value">${mass}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-layer-group"></i> دسته</span><span class="value fa">${catFa}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-arrows-left-right"></i> گروه/دوره</span><span class="value">${el.group} / ${el.period}</span></div>
                    <div class="info full"><span class="label"><i class="fa fa-atom"></i> آرایش الکترونی</span><span class="value" style="direction:ltr;text-align:left">${el.electron_configuration}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-bolt"></i> الکترونگاتیوی</span><span class="value">${eneg}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-circle"></i> شعاع اتمی</span><span class="value">${radius}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-cube"></i> چگالی</span><span class="value">${el.density}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-temperature-high"></i> نقطه ذوب</span><span class="value">${el.melting_point}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-temperature-low"></i> نقطه جوش</span><span class="value">${el.boiling_point}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-flask"></i> حالت ماده</span><span class="value fa">${el.phase}</span></div>
                    <div class="info"><span class="label"><i class="fa fa-calendar"></i> سال کشف</span><span class="value">${el.year}</span></div>
                    <div class="info full"><span class="label"><i class="fa fa-user-graduate"></i> کاشف</span><span class="value fa">${el.discoverer}</span></div>
                </div>
            `;
            drawAtom(el.number);
        }

        closeBtn.onclick = () => overlay.classList.remove('show');
        overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };

        // ===== نمایش اتم =====
        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;

        function shells(Z) {
            const caps = [2, 8, 18, 32, 32, 18, 8];
            let res = [];
            let i = 0;
            while (Z > 0) {
                let e = Math.min(caps[i] || 8, Z);
                res.push(e);
                Z -= e;
                i++;
            }
            return res;
        }

        let animFrame = null;

        function drawAtom(Z) {
            if (animFrame) cancelAnimationFrame(animFrame);
            const sh = shells(Z);

            function loop() {
                ctx.clearRect(0, 0, 240, 240);
                const cx = 120,
                    cy = 120;

                const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 110);
                bgGrad.addColorStop(0, 'rgba(96,165,250,0.03)');
                bgGrad.addColorStop(1, 'rgba(96,165,250,0)');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 240, 240);

                const coreGrad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 20);
                coreGrad.addColorStop(0, '#ff6b6b');
                coreGrad.addColorStop(0.3, '#ee5a24');
                coreGrad.addColorStop(0.7, '#d63031');
                coreGrad.addColorStop(1, 'rgba(214,48,49,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fillStyle = coreGrad;
                ctx.shadowColor = '#ff6b6b';
                ctx.shadowBlur = 40;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(cx, cy, 11, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4757';
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(Z, cx, cy);

                sh.forEach((e, i) => {
                    const r = 30 + i * 22;
                    const hue = 200 + i * 12;

                    ctx.strokeStyle = `hsla(${hue}, 70%, 65%, 0.2)`;
                    ctx.lineWidth = 1.2;
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    for (let k = 0; k < e; k++) {
                        const a = (k / e) * Math.PI * 2 + angle * (i + 1) * 0.5;
                        const x = cx + Math.cos(a) * r;
                        const y = cy + Math.sin(a) * r;

                        const eGrad = ctx.createRadialGradient(x - 1, y - 1, 1, x, y, 5);
                        eGrad.addColorStop(0, `hsl(${hue}, 100%, 90%)`);
                        eGrad.addColorStop(0.5, `hsl(${hue}, 90%, 70%)`);
                        eGrad.addColorStop(1, `hsl(${hue}, 80%, 50%)`);
                        ctx.beginPath();
                        ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                        ctx.fillStyle = eGrad;
                        ctx.shadowColor = `hsl(${hue}, 90%, 60%)`;
                        ctx.shadowBlur = 15;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                });

                sh.forEach((e, i) => {
                    const r = 30 + i * 22;
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.font = '7px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(`n=${i+1}`, cx + r + 6, cy - 2);
                });

                angle += 0.022;
                animFrame = requestAnimationFrame(loop);
            }
            loop();
        }

        // ===== دکمه بازگشت =====
        const backBtn = document.getElementById('backTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }
        });
    </script>
