<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جدول تناوبی SA</title>
    <link rel="stylesheet" href="fontawesome/css/all.min.css" />
    <style>
        /* ===== فونت ===== */
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: VazirmatnLocal;
            src: url("fonts/Vazirmatn-Bold.woff2") format("woff2");
            font-weight: 700;
            font-display: swap;
        }

        /* ===== ریشه ===== */
        :root {
            --bg: #0b1220;
            --bg2: #0f172a;
            --text: #e8eefc;
            --muted: #9fb0d0;
            --accent: #6ea8fe;
            --accent2: #8b5cf6;
            --border: rgba(255, 255, 255, .08);
            --shadow: 0 18px 50px rgba(0, 0, 0, .45);
            --glass: blur(14px);
            --radius: 24px;
            --card-bg: rgba(255, 255, 255, .04);
            --tab-bg: rgba(255, 255, 255, .04);
            --tab-active: rgba(110, 168, 254, .15);
            --glow: #6ea8fe;
            --bg-light: #eef2f7;
            --bg2-light: #d5dee8;
            --text-light: #1a202c;
            --muted-light: #5a6a7e;
            --border-light: rgba(0, 0, 0, .1);
            --shadow-light: 0 10px 30px rgba(0, 0, 0, .08);
            --card-bg-light: rgba(255, 255, 255, .7);

            /* رنگ‌های دسته‌بندی */
            --alkali: #ff595e;
            --alkaline: #ff924c;
            --transition: #ffca3a;
            --metalloid: #8ac926;
            --nonmetal: #00c2ff;
            --halogen: #c77dff;
            --noble: #00f5d4;
            --lanthanide: #ff66c4;
            --actinide: #ff006e;
            --post-transition: #ffb347;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg2: var(--bg2-light);
            --text: var(--text-light);
            --muted: var(--muted-light);
            --border: var(--border-light);
            --shadow: var(--shadow-light);
            --tab-bg: rgba(0, 0, 0, .04);
            --tab-active: rgba(110, 168, 254, .12);
            --card-bg: var(--card-bg-light);
            --glow: #0088cc;
        }

        /* ===== عمومی ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: VazirmatnLocal, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top left, rgba(110, 168, 254, .2), transparent 28%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, .18), transparent 34%);
            background-attachment: fixed;
            color: var(--text);
            transition: all .3s;
            padding: 20px;
        }

        body.light-mode {
            background: var(--bg-light);
            background-image: radial-gradient(circle at top left, rgba(110, 168, 254, .08), transparent 28%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, .06), transparent 34%);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== پنل اصلی ===== */
        .panel {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02));
            border: 1px solid var(--border);
            backdrop-filter: var(--glass);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            transition: all .3s;
        }

        body.light-mode .panel {
            background: rgba(255, 255, 255, .75);
            border-color: rgba(0, 0, 0, .08);
            box-shadow: var(--shadow-light);
        }

        /* ===== هدر ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand-badge {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(110, 168, 254, .28), rgba(139, 92, 246, .24));
            border: 1px solid rgba(255, 255, 255, .1);
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
            flex-shrink: 0;
            transition: all .3s;
            color: var(--text);
        }
        body.light-mode .brand-badge {
            background: linear-gradient(135deg, rgba(110, 168, 254, .2), rgba(139, 92, 246, .15));
            border-color: rgba(0, 0, 0, .06);
        }

        .brand-title h1 {
            margin: 0;
            font-size: 24px;
        }
        .brand-title p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ===== جستجو ===== */
        .search-input {
            width: 220px;
            padding: 11px 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            backdrop-filter: var(--glass);
            border-radius: 14px;
            color: var(--text);
            font-size: 14px;
            transition: all .3s;
            font-family: inherit;
        }
        .search-input::placeholder {
            color: var(--muted);
        }
        body.light-mode .search-input {
            background: rgba(255, 255, 255, .8);
            border-color: rgba(0, 0, 0, .1);
            color: var(--text-light);
        }
        body.light-mode .search-input::placeholder {
            color: #999;
        }
        .search-input:focus {
            width: 280px;
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, .08);
        }
        body.light-mode .search-input:focus {
            background: rgba(255, 255, 255, .95);
            border-color: var(--accent);
        }

        /* ===== دکمه‌ها ===== */
        .theme-btn,
        .back-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .05);
            backdrop-filter: var(--glass);
            color: var(--text);
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all .3s;
            padding: 11px 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        body.light-mode .theme-btn,
        body.light-mode .back-btn {
            background: rgba(255, 255, 255, .7);
            border-color: rgba(0, 0, 0, .08);
            color: var(--text-light);
        }
        .theme-btn:hover,
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
            border-color: var(--accent);
        }
        body.light-mode .theme-btn:hover,
        body.light-mode .back-btn:hover {
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);
        }

        .theme-btn .icon {
            width: 20px;
            height: 20px;
        }

        /* ===== افسانه (legend) ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        /* ===== جدول ===== */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 0;
            direction: ltr;
            /* جدول از چپ به راست */;
        }

        #table {
            display: grid;
            grid-template-columns: repeat(18, 62px);
            gap: 5px;
            padding: 8px 0;
            width: max-content;
            margin: 0 auto;
        }

        /* ===== المان ===== */
        .element {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px 2px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border);
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all .25s ease;
            position: relative;
            user-select: none;
        }
        .element:hover {
            transform: scale(1.12) translateY(-3px);
            z-index: 2;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(110, 168, 254, .35);
        }
        body.light-mode .element:hover {
            box-shadow: 0 0 30px rgba(110, 168, 254, .15);
        }

        .element .symbol {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        }
        .element .number {
            font-size: 9px;
            opacity: .8;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .2);
        }
        .element .name,
        .element .mass {
            display: none;
        }

        /* ===== رنگ‌های دسته‌بندی ===== */
        .alkali {
            background: var(--alkali);
            border-color: var(--alkali);
        }
        .alkaline {
            background: var(--alkaline);
            border-color: var(--alkaline);
        }
        .transition {
            background: var(--transition);
            border-color: var(--transition);
        }
        .metalloid {
            background: var(--metalloid);
            border-color: var(--metalloid);
        }
        .nonmetal {
            background: var(--nonmetal);
            border-color: var(--nonmetal);
        }
        .halogen {
            background: var(--halogen);
            border-color: var(--halogen);
        }
        .noble {
            background: var(--noble);
            border-color: var(--noble);
        }
        .lanthanide {
            background: var(--lanthanide);
            border-color: var(--lanthanide);
        }
        .actinide {
            background: var(--actinide);
            border-color: var(--actinide);
        }
        .post-transition {
            background: var(--post-transition);
            border-color: var(--post-transition);
        }

        /* ===== ردیف f ===== */
        #fblock {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            direction: ltr;
        }
        .fblock-label {
            font-size: 14px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
            direction: rtl;
        }
        .fblock-label i {
            color: var(--accent);
        }
        .frow {
            display: grid;
            grid-template-columns: repeat(15, 62px);
            gap: 5px;
            width: max-content;
        }

        /* ===== اطلاعات عنصر (اورلی) ===== */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        #overlay.show {
            display: flex;
        }

        #focus {
            width: 95%;
            max-width: 520px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            position: relative;
            animation: fadeUp .4s cubic-bezier(.2, .8, .2, 1);
        }
        body.light-mode #focus {
            background: var(--bg-light);
        }

        #close {
            position: absolute;
            top: 12px;
            left: 16px;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            transition: .3s;
            background: none;
            border: none;
            font-family: inherit;
            padding: 8px;
            border-radius: 50%;
        }
        #close:hover {
            color: var(--text);
            transform: rotate(90deg);
            background: rgba(255, 255, 255, .05);
        }

        #content {
            direction: rtl;
            text-align: right;
            font-size: 14px;
            padding-top: 8px;
        }
        #content .bigSymbol {
            font-size: 56px;
            font-weight: 800;
            color: var(--glow);
            text-align: center;
            line-height: 1.2;
        }
        #content .bigName {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
        }
        #content .info {
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        #content .info .label {
            opacity: .7;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #content .info .label i {
            font-size: 12px;
        }
        #content .info .value {
            font-weight: 600;
        }

        #atomCanvas {
            display: block;
            margin: 18px auto 0;
            width: 100%;
            max-width: 220px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 168, 254, .06), transparent 70%);
        }

        /* ===== دکمه بازگشت ===== */
        .back-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            padding: 14px 18px;
            border-radius: 50%;
            background: rgba(110, 168, 254, .2);
            border: 1px solid rgba(110, 168, 254, .3);
            color: var(--text);
            cursor: pointer;
            font-size: 20px;
            transition: all .3s;
            opacity: 0;
            transform: translateY(20px);
            backdrop-filter: blur(10px);
        }
        .back-top-btn.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .back-top-btn:hover {
            transform: translateY(-4px) scale(1.05);
            background: rgba(110, 168, 254, .3);
        }
        body.light-mode .back-top-btn {
            background: rgba(110, 168, 254, .12);
            border-color: rgba(110, 168, 254, .2);
            color: var(--text-light);
        }
        body.light-mode .back-top-btn:hover {
            background: rgba(110, 168, 254, .2);
        }

        /* ===== انیمیشن‌ها ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== اسکرول ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 820px) {
            .panel {
                padding: 18px;
            }
            #table {
                grid-template-columns: repeat(18, 48px);
                gap: 4px;
            }
            .frow {
                grid-template-columns: repeat(15, 48px);
                gap: 4px;
            }
            .element {
                min-height: 50px;
                padding: 2px;
                border-radius: 8px;
            }
            .element .symbol {
                font-size: 15px;
            }
            .element .number {
                font-size: 7px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .topbar-left {
                justify-content: center;
            }
            .topbar-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            .search-input {
                width: 100%;
                max-width: 300px;
            }
            .search-input:focus {
                width: 100%;
            }
            #focus {
                padding: 20px;
                max-width: 100%;
            }
            #content .bigSymbol {
                font-size: 40px;
            }
            #content .bigName {
                font-size: 20px;
            }
            .legend {
                gap: 6px;
                padding: 8px 12px;
            }
            .legend-item {
                font-size: 10px;
            }
            .legend-color {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-width: 520px) {
            #table {
                grid-template-columns: repeat(18, 36px);
                gap: 3px;
            }
            .frow {
                grid-template-columns: repeat(15, 36px);
                gap: 3px;
            }
            .element {
                min-height: 38px;
                border-radius: 6px;
            }
            .element .symbol {
                font-size: 12px;
            }
            .element .number {
                font-size: 6px;
            }
            .brand-title h1 {
                font-size: 18px;
            }
            .brand-badge {
                width: 44px;
                height: 44px;
                font-size: 16px;
                border-radius: 14px;
            }
            .theme-btn,
            .back-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            .back-top-btn {
                bottom: 20px;
                right: 20px;
                padding: 12px 16px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">

            <!-- هدر -->
            <div class="topbar">
                <div class="topbar-left">
                    <div class="brand-badge">⚛</div>
                    <div class="brand-title">
                        <h1>جدول تناوبی</h1>
                        <p>۱۱۸ عنصر • نمایش اتمی</p>
                    </div>
                </div>
                <div class="topbar-right">
                    <input type="text" class="search-input" id="searchInput" placeholder="🔍 جستجو عنصر..." autocomplete="off" />
                    <button class="theme-btn" onclick="toggleTheme()" aria-label="تغییر تم">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                            <path d="M12 2.5V5.5M12 18.5V21.5M5.5 12H2.5M21.5 12H18.5M18.364 5.636l-2 2M7.636 16.364l-2 2M16.364 16.364l2 2M5.636 5.636l2 2"/>
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                    </button>
                    <button class="back-btn" onclick="location.href='index.html'" title="بازگشت به صفحه اصلی">
                        <i class="fa fa-arrow-left"></i>
                    </button>
                </div>
            </div>

            <!-- افسانه -->
            <div class="legend">
                <span class="legend-item"><span class="legend-color" style="background:var(--alkali)"></span> قلیایی</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--alkaline)"></span> قلیایی خاکی</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--transition)"></span> فلز واسطه</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--post-transition)"></span> پس‌واسطه</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--metalloid)"></span> شبه‌فلز</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--nonmetal)"></span> نافلز</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--halogen)"></span> هالوژن</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--noble)"></span> گاز نجیب</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--lanthanide)"></span> لانتانید</span>
                <span class="legend-item"><span class="legend-color" style="background:var(--actinide)"></span> اکتینید</span>
            </div>

            <!-- جدول -->
            <div class="table-wrapper">
                <div id="table"></div>
            </div>

            <!-- ردیف f -->
            <div id="fblock">
                <div class="fblock-label"><i class="fa fa-arrow-down"></i> لانتانیدها (۵۷–۷۱)</div>
                <div class="table-wrapper"><div id="lan" class="frow"></div></div>
                <div class="fblock-label"><i class="fa fa-arrow-down"></i> اکتینیدها (۸۹–۱۰۳)</div>
                <div class="table-wrapper"><div id="act" class="frow"></div></div>
            </div>

        </div>
    </div>

    <!-- اورلی اطلاعات -->
    <div id="overlay">
        <div id="focus">
            <button id="close">✕</button>
            <div id="content"></div>
            <canvas id="atomCanvas" width="220" height="220"></canvas>
        </div>
    </div>

    <!-- دکمه بازگشت به بالا -->
    <button class="back-top-btn" id="backTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fa fa-arrow-up"></i>
    </button>

    <script>
        // ===== داده‌های عناصر =====
        const elements = [
            { number: 1, symbol: "H", name: "هیدروژن", atomic_mass: 1.008, category: "nonmetal", group: 1,
                period: 1, electron_configuration: "1s1", shells: [1], electronegativity: 2.20,
                atomic_radius: "53 pm", melting_point: "-259°C", boiling_point: "-253°C",
                density: "0.000089 g/cm³", phase: "گاز", discoverer: "کاوندیش" },
            { number: 2, symbol: "He", name: "هلیوم", atomic_mass: 4.0026, category: "noble", group: 18,
                period: 1, electron_configuration: "1s2", shells: [2], electronegativity: null,
                atomic_radius: "31 pm", melting_point: "-272°C", boiling_point: "-269°C",
                density: "0.000178 g/cm³", phase: "گاز", discoverer: "یانسن" },
            { number: 3, symbol: "Li", name: "لیتیوم", atomic_mass: 6.94, category: "alkali", group: 1,
                period: 2, electron_configuration: "[He]2s1", shells: [2, 1], electronegativity: 0.98,

                phase: "جامد", discoverer: "هافمن" },
            { number: 112, symbol: "Cn", name: "کوپرنیسیم", atomic_mass: 285, category: "transition",
                group: 12, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2",
                shells: [2, 8, 18, 32, 32, 18, 2], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "هافمن" },
            { number: 113, symbol: "Nh", name: "نیهونیم", atomic_mass: 286, category: "post-transition",
                group: 13, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p1",
                shells: [2, 8, 18, 32, 32, 18, 3], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "کوسوکه موریتا" },
            { number: 114, symbol: "Fl", name: "فلروویوم", atomic_mass: 289, category: "post-transition",
                group: 14, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p2",
                shells: [2, 8, 18, 32, 32, 18, 4], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "فلروف" },
            { number: 115, symbol: "Mc", name: "مسکوویوم", atomic_mass: 290, category: "post-transition",
                group: 15, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p3",
                shells: [2, 8, 18, 32, 32, 18, 5], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "اوگانسیان" },
            { number: 116, symbol: "Lv", name: "لیورموریوم", atomic_mass: 293, category: "post-transition",
                group: 16, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p4",
                shells: [2, 8, 18, 32, 32, 18, 6], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "اوگانسیان" },
            { number: 117, symbol: "Ts", name: "تنسی", atomic_mass: 294, category: "halogen",
                group: 17, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p5",
                shells: [2, 8, 18, 32, 32, 18, 7], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "جامد", discoverer: "اوگانسیان" },
            { number: 118, symbol: "Og", name: "اوگانسون", atomic_mass: 294, category: "noble",
                group: 18, period: 7, electron_configuration: "[Rn]5f14 6d10 7s2 7p6",
                shells: [2, 8, 18, 32, 32, 18, 8], electronegativity: null, atomic_radius: "—",
                melting_point: "—", boiling_point: "—", density: "—",
                phase: "ناشناخته", discoverer: "اوگانسیان" }
        ];

        // ===== ساخت جدول =====
        const tableEl = document.getElementById('table');
        const lanEl = document.getElementById('lan');
        const actEl = document.getElementById('act');

        function createElementCard(el) {
            const div = document.createElement('div');
            div.className = `element ${el.category}`;
            div.innerHTML = `
                <div class="number">${el.number}</div>
                <div class="symbol">${el.symbol}</div>
                <div class="name">${el.name}</div>
                <div class="mass">${el.atomic_mass}</div>
            `;
            div.onclick = () => focusElement(el);
            return div;
        }

        elements.forEach(el => {
            if (el.number >= 57 && el.number <= 71) {
                lanEl.appendChild(createElementCard(el));
            } else if (el.number >= 89 && el.number <= 103) {
                actEl.appendChild(createElementCard(el));
            } else {
                const card = createElementCard(el);
                card.style.gridColumn = el.group;
                card.style.gridRow = el.period;
                tableEl.appendChild(card);
            }
        });

        // ===== جستجو =====
        document.getElementById('searchInput').addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            document.querySelectorAll('.element').forEach(el => {
                const text = el.textContent.toLowerCase();
                el.style.display = text.includes(q) ? '' : 'none';
            });
        });

        // ===== تم =====
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // ===== اورلی اطلاعات =====
        const overlay = document.getElementById('overlay');
        const content = document.getElementById('content');
        const closeBtn = document.getElementById('close');

        function focusElement(el) {
            overlay.classList.add('show');
            content.innerHTML = `
                <div class="bigSymbol">${el.symbol}</div>
                <div class="bigName">${el.name}</div>
                <div class="info"><span class="label"><i class="fa fa-hashtag"></i> عدد اتمی</span><span class="value">${el.number}</span></div>
                <div class="info"><span class="label"><i class="fa fa-weight-scale"></i> جرم اتمی</span><span class="value">${el.atomic_mass}</span></div>
                <div class="info"><span class="label"><i class="fa fa-layer-group"></i> دسته</span><span class="value">${el.category}</span></div>
                <div class="info"><span class="label"><i class="fa fa-atom"></i> آرایش الکترونی</span><span class="value">${el.electron_configuration}</span></div>
                <div class="info"><span class="label"><i class="fa fa-cube"></i> چگالی</span><span class="value">${el.density}</span></div>
                <div class="info"><span class="label"><i class="fa fa-temperature-high"></i> نقطه ذوب</span><span class="value">${el.melting_point}</span></div>
                <div class="info"><span class="label"><i class="fa fa-temperature-low"></i> نقطه جوش</span><span class="value">${el.boiling_point}</span></div>
                <div class="info"><span class="label"><i class="fa fa-flask"></i> حالت ماده</span><span class="value">${el.phase}</span></div>
                <div class="info"><span class="label"><i class="fa fa-user-graduate"></i> کاشف</span><span class="value">${el.discoverer}</span></div>
            `;
            drawAtom(el.number);
        }

        closeBtn.onclick = () => overlay.classList.remove('show');
        overlay.onclick = e => { if (e.target === overlay) overlay.classList.remove('show'); };

        // ===== نمایش اتم (Bohr Model) =====
        const canvas = document.getElementById('atomCanvas');
        const ctx = canvas.getContext('2d');
        let angle = 0;

        function shells(Z) {
            const caps = [2, 8, 18, 32, 32, 18, 8];
            let res = [];
            let i = 0;
            while (Z > 0) {
                let e = Math.min(caps[i] || 8, Z);
                res.push(e);
                Z -= e;
                i++;
            }
            return res;
        }

        let animFrame = null;

        function drawAtom(Z) {
            if (animFrame) cancelAnimationFrame(animFrame);
            const sh = shells(Z);

            function loop() {
                ctx.clearRect(0, 0, 220, 220);
                const cx = 110,
                    cy = 110;

                // هسته با درخشش
                const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18);
                grad.addColorStop(0, '#ff6b6b');
                grad.addColorStop(0.5, '#ee5a24');
                grad.addColorStop(1, 'rgba(238,90,36,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, 16, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.shadowColor = '#ff6b6b';
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.shadowBlur = 0;

                // هسته اصلی
                ctx.beginPath();
                ctx.arc(cx, cy, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4757';
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;

                // الکترون‌ها
                sh.forEach((e, i) => {
                    const r = 28 + i * 20;
                    const hue = 200 + i * 15;

                    // مدار
                    ctx.strokeStyle = `hsla(${hue}, 80%, 65%, 0.25)`;
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // الکترون‌ها
                    for (let k = 0; k < e; k++) {
                        const a = (k / e) * Math.PI * 2 + angle * (i + 1) * 0.6;
                        const x = cx + Math.cos(a) * r;
                        const y = cy + Math.sin(a) * r;

                        const eGrad = ctx.createRadialGradient(x, y, 1, x, y, 5);
                        eGrad.addColorStop(0, `hsl(${hue}, 100%, 85%)`);
                        eGrad.addColorStop(1, `hsl(${hue}, 90%, 65%)`);
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = eGrad;
                        ctx.shadowColor = `hsl(${hue}, 90%, 65%)`;
                        ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                });

                angle += 0.025;
                animFrame = requestAnimationFrame(loop);
            }
            loop();
        }

        // ===== دکمه بازگشت به بالا =====
        const backBtn = document.getElementById('backTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }
        });
    </script>
