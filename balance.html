<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0b1220"/>
  <title>SA-CB</title>
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="fontawesome/css/all.min.css">
  <style>
    @font-face{
      font-family:"VazirmatnLocal";
      src:url("fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight:400;
      font-style:normal;
      font-display:swap;
    }
    @font-face{
      font-family:"VazirmatnLocal";
      src:url("fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight:700;
      font-style:normal;
      font-display:swap;
    }
    :root{
      --bg:#0b1220;
      --card:#111a2e;
      --text:#e8eefc;
      --muted:#9fb0d0;
      --accent:#6ea8fe;
      --accent2:#8b5cf6;
      --border:rgba(255,255,255,.08);
      --success:#35d07f;
      --danger:#ff6b6b;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --logo-bg1: rgb(35,46,64);
      --logo-bg2: rgb(27,37,53);
      --logo-bg3: rgb(18,28,42);
      --logo-text: #289CFF;
      --badge-bg1: rgba(40,52,72,.95);
      --badge-bg2: rgba(22,29,42,.98);
      --preloader-bg: linear-gradient(180deg, #09111d, #0b1220);
      --body-bg1: #09111d;
      --body-bg2: #0b1220;
      --body-bg3: #08101a;
      --input-bg: rgba(6,12,22,.72);
      --footer-color: #9fb0d0;
    }

    body.light-mode{
      --bg:#f2f6ff;
      --card:#ffffff;
      --text:#0b1220;
      --muted:#445566;
      --accent:#3b82f6;
      --accent2:#8b5cf6;
      --border:rgba(0,0,0,.12);
      --success:#059669;
      --danger:#dc2626;
      --shadow:0 18px 45px rgba(0,0,0,.12);
      --logo-bg1: #e8edf5;
      --logo-bg2: #d5dde8;
      --logo-bg3: #c5cfdd;
      --logo-text: #2563eb;
      --badge-bg1: rgba(230,240,255,.95);
      --badge-bg2: rgba(200,215,240,.98);
      --preloader-bg: linear-gradient(180deg, #eef3ff, #f8fbff);
      --body-bg1: #f2f6ff;
      --body-bg2: #f8fbff;
      --body-bg3: #eef3ff;
      --input-bg: rgba(255,255,255,.8);
      --footer-color: #556677;
    }

    *{box-sizing:border-box}
    html,body{
      min-height:100%;
      height:auto;
    }

    body{
      margin:0;
      font-family:"VazirmatnLocal", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(110,168,254,.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139,92,246,.14), transparent 35%),
        linear-gradient(180deg, var(--body-bg1), var(--body-bg2) 55%, var(--body-bg3));
      overflow-x:hidden;
      transition: background .3s ease, color .3s ease;
    }

    /* ===== PRELOADER پیشرفته و مدرن ===== */
    #preloader{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:32px;
      background:var(--preloader-bg);
      transition: background .3s ease, opacity .7s ease, visibility .7s ease;
      opacity:1;
      visibility:visible;
    }
    #preloader.hidden {
      opacity:0;
      visibility:hidden;
    }

    /* حلقه‌های چرخان متعدد */
    .loader-wrapper {
      position:relative;
      width:120px;
      height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .loader-ring {
      position:absolute;
      border-radius:50%;
      border:3px solid transparent;
      animation: spin var(--duration) linear infinite;
    }

    .loader-ring:nth-child(1) {
      width:120px;
      height:120px;
      border-top-color:var(--accent);
      border-right-color:var(--accent);
      --duration:1.2s;
      animation-delay:0s;
    }
    .loader-ring:nth-child(2) {
      width:92px;
      height:92px;
      border-bottom-color:var(--accent2);
      border-left-color:var(--accent2);
      --duration:1.6s;
      animation-delay:0.2s;
    }
    .loader-ring:nth-child(3) {
      width:64px;
      height:64px;
      border-top-color:rgba(110,168,254,.4);
      border-right-color:rgba(110,168,254,.4);
      --duration:2s;
      animation-delay:0.4s;
    }
    .loader-ring:nth-child(4) {
      width:36px;
      height:36px;
      border-bottom-color:rgba(139,92,246,.4);
      border-left-color:rgba(139,92,246,.4);
      --duration:2.4s;
      animation-delay:0.6s;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* افکت پالس در مرکز */
    .loader-pulse {
      position:absolute;
      width:16px;
      height:16px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      animation: pulse 1.5s ease-in-out infinite;
      box-shadow: 0 0 30px rgba(110,168,254,.3);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity:1; }
      50% { transform: scale(1.6); opacity:0.4; }
    }

    /* متن لوگو با انیمیشن */
    .loader-brand {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
    }
    .loader-brand .main {
      font-size:2.2rem;
      font-weight:900;
      letter-spacing:4px;
      background:linear-gradient(90deg, var(--accent), var(--accent2), var(--accent), var(--accent2));
      background-size:300% 100%;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      animation: gradientMove 3s ease-in-out infinite;
      text-shadow:0 0 40px rgba(110,168,254,.1);
    }
    .loader-brand .sub {
      font-size:.85rem;
      color:var(--muted);
      letter-spacing:6px;
      opacity:0.6;
      animation: fadePulse 2s ease-in-out infinite;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes fadePulse {
      0%, 100% { opacity:0.4; }
      50% { opacity:0.9; }
    }

    /* دایره‌های کوچک متحرک */
    .loader-dots {
      display:flex;
      gap:14px;
      margin-top:4px;
    }
    .loader-dots span {
      width:10px;
      height:10px;
      border-radius:50%;
      animation: dotWave 1.4s ease-in-out infinite;
    }
    .loader-dots span:nth-child(1) {
      background:var(--accent);
      animation-delay:0s;
    }
    .loader-dots span:nth-child(2) {
      background:var(--accent2);
      animation-delay:0.2s;
    }
    .loader-dots span:nth-child(3) {
      background:var(--accent);
      animation-delay:0.4s;
    }
    .loader-dots span:nth-child(4) {
      background:var(--accent2);
      animation-delay:0.6s;
    }
    .loader-dots span:nth-child(5) {
      background:var(--accent);
      animation-delay:0.8s;
    }
    @keyframes dotWave {
      0%, 40%, 100% { 
        transform: translateY(0) scale(0.6);
        opacity:0.3;
      }
      20% { 
        transform: translateY(-14px) scale(1);
        opacity:1;
      }
    }

    /* particles background */
    .loader-particles {
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }
    .loader-particles span {
      position:absolute;
      width:4px;
      height:4px;
      border-radius:50%;
      background:var(--accent);
      opacity:0;
      animation: particleFloat var(--dur) ease-in-out infinite;
      animation-delay:var(--delay);
    }
    @keyframes particleFloat {
      0% {
        opacity:0;
        transform:translateY(0) scale(0);
      }
      20% {
        opacity:0.8;
        transform:translateY(-20px) scale(1);
      }
      80% {
        opacity:0.8;
        transform:translateY(-60px) scale(0.8);
      }
      100% {
        opacity:0;
        transform:translateY(-80px) scale(0);
      }
    }

    .loader-progress-bar {
      width:200px;
      height:2px;
      background:rgba(255,255,255,.06);
      border-radius:4px;
      overflow:hidden;
      position:relative;
    }
    .loader-progress-bar .fill {
      height:100%;
      width:0%;
      background:linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius:4px;
      animation: progressFill 2.5s ease-in-out forwards;
    }
    @keyframes progressFill {
      0% { width:0%; }
      50% { width:65%; }
      80% { width:85%; }
      100% { width:100%; }
    }

    body.light-mode .loader-ring:nth-child(1) {
      border-top-color:var(--accent);
      border-right-color:var(--accent);
    }
    body.light-mode .loader-ring:nth-child(2) {
      border-bottom-color:var(--accent2);
      border-left-color:var(--accent2);
    }
    body.light-mode .loader-ring:nth-child(3) {
      border-top-color:rgba(59,130,246,.4);
      border-right-color:rgba(59,130,246,.4);
    }
    body.light-mode .loader-ring:nth-child(4) {
      border-bottom-color:rgba(139,92,246,.4);
      border-left-color:rgba(139,92,246,.4);
    }
    body.light-mode .loader-pulse {
      box-shadow: 0 0 30px rgba(59,130,246,.2);
    }
    body.light-mode .loader-progress-bar {
      background:rgba(0,0,0,.08);
    }
    body.light-mode .loader-particles span {
      background:var(--accent);
    }

    .container{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px 40px;
    }

    .wrap{
      width:min(760px, 100%);
    }

    header{
      text-align:center;
      margin-bottom:18px;
      user-select:none;
      position:relative;
    }

    header h1{
      margin:0;
      font-size:clamp(2rem, 4vw, 3rem);
      line-height:1.1;
      letter-spacing:.5px;
      text-shadow:0 0 18px rgba(110,168,254,.18);
      color:var(--text);
      transition: color .3s ease;
    }

    header .brand{
      margin-top:10px;
      color:var(--muted);
      font-size:.98rem;
      transition: color .3s ease;
    }

    /* ===== دکمه رفرش بالا سمت راست ===== */
    .refresh-btn {
      position:fixed;
      top:16px;
      left:16px;
      z-index:999;
      width:44px;
      height:44px;
      border-radius:50%;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      font-size:1.2rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:var(--shadow);
      transition: all .25s ease;
      backdrop-filter: blur(12px);
    }
    .refresh-btn:hover {
      transform:rotate(60deg) scale(1.05);
      border-color:var(--accent);
      background:rgba(110,168,254,.12);
    }
    .refresh-btn:active {
      transform:rotate(60deg) scale(0.92);
    }
    .refresh-btn i {
      transition: transform .3s ease;
    }
    .refresh-btn:hover i {
      transform:rotate(-60deg);
    }

    .card{
      position:relative;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(14px);
      padding:22px;
      overflow:hidden;
      transition: background .3s ease, border .3s ease, box-shadow .3s ease;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:24px;
      padding:1px;
      background:linear-gradient(135deg, rgba(110,168,254,.35), rgba(139,92,246,.25), rgba(110,168,254,.12));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .hint{
      color:var(--muted);
      font-size:.92rem;
      line-height:1.6;
      transition: color .3s ease;
    }

    .samples{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-start;
    }

    .chip{
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-size:.86rem;
      cursor:pointer;
      transition:.2s ease;
      user-select:none;
    }
    .chip:hover{
      transform:translateY(-1px);
      border-color:rgba(110,168,254,.35);
      background:rgba(110,168,254,.08);
    }

    .inputRow{
      display:grid;
      grid-template-columns: 1fr auto auto auto;
      gap:10px;
      margin-top:12px;
    }

    input{
      width:100%;
      border:none;
      outline:none;
      background:var(--input-bg);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:16px;
      padding:15px 16px;
      font-size:1rem;
      direction:ltr;
      text-align:left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
      transition:.2s ease;
    }

    input:focus{
      border-color:rgba(110,168,254,.45);
      box-shadow:0 0 0 4px rgba(110,168,254,.08);
    }

    button{
      border:none;
      outline:none;
      border-radius:16px;
      padding:14px 16px;
      cursor:pointer;
      font-weight:700;
      color:#fff;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 10px 24px rgba(110,168,254,.18);
      transition:.2s ease;
      white-space:nowrap;
    }

    button:hover{ transform: translateY(-1px); }
    button:active{ transform: translateY(0); }

    .btnSecondary{
      background:rgba(255,255,255,.05);
      border:1px solid var(--border);
      box-shadow:none;
      color:var(--text);
    }
    .btnSecondary:hover{
      background:rgba(255,255,255,.08);
    }

    .resultBox{
      margin-top:18px;
      padding:16px;
      border-radius:18px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      transition: background .3s ease, border .3s ease;
    }

    .resultLabel{
      font-size:.9rem;
      color:var(--muted);
      margin-bottom:10px;
      transition: color .3s ease;
    }

    .result{
      font-size:1.25rem;
      line-height:1.9;
      font-weight:800;
      word-break:break-word;
      color:var(--text);
      transition: color .3s ease;
    }

    .error{
      margin-top:10px;
      color:var(--danger);
      font-size:.95rem;
      min-height:1.4em;
      line-height:1.6;
      transition: color .3s ease;
    }

    .metaRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
      color:var(--muted);
      font-size:.88rem;
      transition: color .3s ease;
    }

    .history{
      margin-top:18px;
      display:none;
    }

    .historyTitle{
      color:var(--muted);
      font-size:.92rem;
      margin-bottom:10px;
      transition: color .3s ease;
    }

    .historyList{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .historyItem{
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--border);
      cursor:pointer;
      color:var(--text);
      font-size:.85rem;
      transition:.2s ease;
    }
    .historyItem:hover{
      background:rgba(110,168,254,.09);
      border-color:rgba(110,168,254,.35);
    }

    /* about & help sections */
    .info-sections {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      justify-content: center;
    }
    .info-sections .btnSecondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: .92rem;
      border-radius: 40px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .2s;
      text-decoration: none;
    }
    .info-sections .btnSecondary i {
      font-size: 1.1rem;
      color: var(--accent);
    }
    .info-sections .btnSecondary:hover {
      background: rgba(255,255,255,.08);
      border-color: var(--accent);
    }

    /* modal overlay with animation - با قابلیت اسکرول */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      color: var(--text);
      position: relative;
      transition: background .3s, border .3s, color .3s, transform .35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .35s ease;
      transform: scale(0.9) translateY(20px);
      opacity: 0;
    }
    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    
    /* هدر مودال - ثابت */
    .modal-header {
      padding: 20px 24px 12px 24px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-family:"VazirmatnLocal", sans-serif;
    }
    .modal-header h2 i {
      color: var(--accent);
    }
    .modal-header .close-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0 8px;
      box-shadow: none;
      background: transparent;
      line-height: 1;
    }
    .modal-header .close-btn:hover {
      color: var(--text);
      background: transparent;
      transform: none;
    }
    
    /* محتوای مودال - قابل اسکرول */
    .modal-body {
      padding: 16px 24px 24px 24px;
      overflow-y: auto;
      flex: 1;
      direction: rtl;
    }
    .modal-body::-webkit-scrollbar {
      width: 5px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: rgba(255,255,255,.05);
      border-radius: 10px;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }
    
    .modal-body p, .modal-body li {
      line-height: 1.8;
      color: var(--muted);
    }
    .modal-body ul {
      padding-right: 20px;
      margin: 8px 0;
    }
    .modal-body .dev-info {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .modal-body .dev-info a {
      color: var(--accent);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .modal-body .dev-info a:hover {
      text-decoration: underline;
    }
    .modal-body code {
      background: rgba(110,168,254,.12);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: .9rem;
      color: var(--accent);
      font-family:"VazirmatnLocal", sans-serif;
    }
    .modal-body h3 {
      font-size: 1.1rem;
      margin-top: 18px;
      margin-bottom: 8px;
      color: var(--text);
    }

    @media (max-width: 700px){
      .card{ padding:16px; border-radius:20px; }
      .inputRow{
        grid-template-columns:1fr 1fr;
      }
      .inputRow input{
        grid-column:1 / -1;
      }
      .topbar{
        align-items:flex-start;
      }
      .result{ font-size:1.08rem; }
      .info-sections .btnSecondary {
        padding: 8px 14px;
        font-size: .85rem;
      }
      .loader-wrapper {
        width:90px;
        height:90px;
      }
      .loader-ring:nth-child(1) {
        width:90px;
        height:90px;
      }
      .loader-ring:nth-child(2) {
        width:70px;
        height:70px;
      }
      .loader-ring:nth-child(3) {
        width:50px;
        height:50px;
      }
      .loader-ring:nth-child(4) {
        width:30px;
        height:30px;
      }
      .loader-brand .main {
        font-size:1.6rem;
      }
      .loader-progress-bar {
        width:150px;
      }
      .modal-box {
        max-height: 90vh;
        border-radius: 20px;
      }
      .modal-header {
        padding: 16px 18px 10px 18px;
      }
      .modal-header h2 {
        font-size: 1.2rem;
      }
      .modal-body {
        padding: 12px 18px 18px 18px;
      }

<script>
  // ===== ایجاد ذرات برای پری‌لودر =====
  (function createParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    const count = 30;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const size = 2 + Math.random() * 4;
      const dur = 3 + Math.random() * 4;
      const delay = Math.random() * 3;
      span.style.cssText = `
        left:${x}%;
        top:${y}%;
        width:${size}px;
        height:${size}px;
        --dur:${dur}s;
        --delay:${delay}s;
        animation-delay:${delay}s;
        animation-duration:${dur}s;
      `;
      container.appendChild(span);
    }
  })();

  // Preloader - با تاخیر و انیمیشن محو
  window.addEventListener("load", () => {
    setTimeout(() => {
      document.getElementById("preloader").classList.add("hidden");
    }, 2800);
  });

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    return b ? gcd(b, a % b) : a;
  }
  function lcm(a, b) {
    return Math.abs(a * b) / gcd(a, b);
  }

  class Frac {
    constructor(n, d = 1) {
      if (d === 0) throw new Error("division by zero");
      if (d < 0) n = -n, d = -d;
      const g = gcd(Math.abs(n), Math.abs(d)) || 1;
      this.n = n / g;
      this.d = d / g;
    }
    add(f) { return new Frac(this.n * f.d + f.n * this.d, this.d * f.d); }
    sub(f) { return new Frac(this.n * f.d - f.n * this.d, this.d * f.d); }
    mul(f) { return new Frac(this.n * f.n, this.d * f.d); }
    div(f) { return new Frac(this.n * f.d, this.d * f.n); }
    value() { return this.n / this.d; }
  }

  function parseFormula(formula) {
    formula = formula.trim()
      .replace(/\(aq\)|\(s\)|\(l\)|\(g\)/g, "")
      .replace(/\s+/g, "");

    if (!formula) throw new Error("فرمول خالی است");

    const tokens = formula.match(/[A-Z][a-z]?|\d+|[\(\)\[\]\{\}]/g);
    if (!tokens) throw new Error("فرمول نامعتبر است");

    const stack = [Object.create(null)];
    const openers = new Set(["(", "[", "{"]);
    const closers = {")":"(", "]":"[", "}":"{"};

    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];

      if (openers.has(t)) {
        stack.push(Object.create(null));
      } else if (closers[t]) {
        if (stack.length === 1) throw new Error("پرانتز نامتوازن");
        const group = stack.pop();
        let mul = 1;
        if (i + 1 < tokens.length && /^\d+$/.test(tokens[i + 1])) {
          mul = parseInt(tokens[++i], 10);
        }
        for (const k in group) {
          stack[stack.length - 1][k] = (stack[stack.length - 1][k] || 0) + group[k] * mul;
        }
      } else if (/^[A-Z][a-z]?$/.test(t)) {
        let count = 1;
        if (i + 1 < tokens.length && /^\d+$/.test(tokens[i + 1])) {
          count = parseInt(tokens[++i], 10);
        }
        stack[stack.length - 1][t] = (stack[stack.length - 1][t] || 0) + count;
      } else if (/^\d+$/.test(t)) {
        throw new Error("عدد در جای نامعتبر");
      } else {
        throw new Error("توکن نامعتبر");
      }
    }

    if (stack.length !== 1) throw new Error("پرانتز باز مانده");
    return stack[0];
  }

  function findPositiveIntegerSolutions(A) {
    const m = A.length;
    const n = A[0].length;
    
    let M = A.map(row => row.map(x => new Frac(x, 1)));
    let r = 0;
    let pivots = [];

    for (let c = 0; c < n && r < m; c++) {
      let pivot = -1;
      for (let i = r; i < m; i++) {
        if (M[i][c].n !== 0) { pivot = i; break; }
      }
      if (pivot === -1) continue;

      [M[r], M[pivot]] = [M[pivot], M[r]];
      const pv = M[r][c];
      for (let j = c; j < n; j++) M[r][j] = M[r][j].div(pv);

      for (let i = 0; i < m; i++) {
        if (i !== r && M[i][c].n !== 0) {
          const factor = M[i][c];
          for (let j = c; j < n; j++) {
            M[i][j] = M[i][j].sub(factor.mul(M[r][j]));
          }
        }
      }

      pivots.push(c);
      r++;
    }

    const freeVars = [];
    for (let j = 0; j < n; j++) {
      if (!pivots.includes(j)) freeVars.push(j);
    }

    if (freeVars.length === 0) {
      return null;
    }

    const results = [];
    
    function tryCombinations(combo) {
      if (combo.length === freeVars.length) {
        const sol = Array(n).fill(0);
        for (let i = 0; i < freeVars.length; i++) {
          sol[freeVars[i]] = combo[i];
        }
        
        let valid = true;
        for (let i = 0; i < r; i++) {
          let sum = new Frac(0, 1);
          for (let j = pivots[i] + 1; j < n; j++) {
            if (M[i][j].n !== 0) {
              sum = sum.add(M[i][j].mul(new Frac(sol[j], 1)));
            }
          }
          const val = sum.n === 0 ? new Frac(0, 1) : sum.mul(new Frac(-1, 1));
          if (val.n < 0) {
            valid = false;
            break;
          }
          sol[pivots[i]] = val.n / val.d;
          if (sol[pivots[i]] % 1 !== 0) {
            valid = false;
            break;
          }
        }
        
        if (valid && sol.some(x => x > 0)) {
          let g = 0;
          for (const x of sol) g = gcd(g, Math.abs(x));
          if (g > 1) {
            for (let i = 0; i < sol.length; i++) sol[i] = sol[i] / g;
          }
          if (sol.every(x => x >= 0) && sol.some(x => x > 0)) {
            results.push(sol);
          }
        }
        return;
      }
      
      for (let v = 1; v <= 15; v++) {
        tryCombinations([...combo, v]);
      }
    }

    tryCombinations([]);
    
    const uniqueResults = [];
    for (const sol of results) {
      let isDuplicate = false;
      for (const existing of uniqueResults) {
        if (sol.every((x, i) => x === existing[i])) {
          isDuplicate = true;
          break;
        }
      }
      if (!isDuplicate) {
        uniqueResults.push(sol);
      }
    }
    
    return uniqueResults.length > 0 ? uniqueResults : null;
  }

  function splitEquation(eq) {
    eq = eq.replace(/→/g, "->").replace(/=/g, "->");
    const parts = eq.split("->");
    if (parts.length !== 2) throw new Error("معادله باید یک فلش داشته باشد");
    const left = parts[0].split("+").map(s => s.trim()).filter(Boolean);
    const right = parts[1].split("+").map(s => s.trim()).filter(Boolean);
    if (!left.length || !right.length) throw new Error("طرفین معادله ناقص هستند");
    return { left, right };
  }

  function fmtFormula(f) {
    return f.replace(/(\d+)/g, "<sub>$1</sub>");
  }

  function balance() {
    const input = document.getElementById("eq").value.trim();
    const resultEl = document.getElementById("result");
    const errorEl = document.getElementById("error");
    const statusEl = document.getElementById("status");
    const copyStatus = document.getElementById("copyStatus");

    errorEl.textContent = "";
    copyStatus.textContent = "";

    if (!input) {
      resultEl.textContent = "—";
      statusEl.innerHTML = '<i class="fas fa-check-circle" style="margin-left:6px;color:var(--accent);"></i>آماده';
      return;
    }

    try {
      const { left, right } = splitEquation(input);
      const mols = [...left, ...right];
      const parsed = mols.map(parseFormula);

      const elements = [...new Set(parsed.flatMap(obj => Object.keys(obj)))];
      const matrix = elements.map(el =>
        mols.map((_, i) => (i < left.length ? 1 : -1) * (parsed[i][el] || 0))
      );

      if (!matrix.length) throw new Error("فرمول‌ها قابل پردازش نیستند");

      const solutions = findPositiveIntegerSolutions(matrix);
      
      if (!solutions || solutions.length === 0) {
        throw new Error("جواب مثبت برای این معادله یافت نشد");
      }

      let bestSolution = solutions[0];
      let bestSum = bestSolution.reduce((a, b) => a + b, 0);
      for (const sol of solutions) {
        const sum = sol.reduce((a, b) => a + b, 0);
        if (sum < bestSum) {
          bestSum = sum;
          bestSolution = sol;
        }
      }

      const ints = bestSolution;
      const lmax = left.length;
      
      const leftCoeffs = [];
      const rightCoeffs = [];
      const leftMols = [];
      const rightMols = [];
      
      for (let i = 0; i < lmax; i++) {
        if (ints[i] > 0) {
          leftCoeffs.push(ints[i]);
          leftMols.push(left[i]);
        }
      }
      
      for (let i = 0; i < right.length; i++) {
        if (ints[lmax + i] > 0) {
          rightCoeffs.push(ints[lmax + i]);
          rightMols.push(right[i]);
        }
      }
      
      if (leftMols.length === 0 || rightMols.length === 0) {
        throw new Error("همه ضرایب صفر شدند");
      }

      const outLeft = leftMols.map((m, i) => {
        const c = leftCoeffs[i];
        return (c !== 1 ? c : "") + fmtFormula(m);
      }).join(" + ");

      const outRight = rightMols.map((m, i) => {
        const c = rightCoeffs[i];
        return (c !== 1 ? c : "") + fmtFormula(m);
      }).join(" + ");

      const balanced = `${outLeft} → ${outRight}`;
      resultEl.innerHTML = balanced;
      statusEl.innerHTML = '<i class="fas fa-check-circle" style="margin-left:6px;color:var(--success);"></i>موازنه شد';
      addToHistory(input, balanced);
    } catch (err) {
      resultEl.textContent = "—";
      errorEl.textContent = "خطا: " + (err.message || "ورودی نامعتبر است");
      statusEl.innerHTML = '<i class="fas fa-exclamation-triangle" style="margin-left:6px;color:var(--danger);"></i>خطا در پردازش';
    }
  }

  function setSample(sample) {
    document.getElementById("eq").value = sample;
    balance();
  }

  function clearAll() {
    document.getElementById("eq").value = "";
    document.getElementById("result").textContent = "—";
    document.getElementById("error").textContent = "";
    document.getElementById("status").innerHTML = '<i class="fas fa-check-circle" style="margin-left:6px;color:var(--accent);"></i>آماده';
    document.getElementById("copyStatus").textContent = "";
    document.getElementById("eq").focus();
  }

  function copyResult() {
    const text = document.getElementById("result").innerText.trim();
    const copyStatus = document.getElementById("copyStatus");
    if (!text || text === "—") {
      copyStatus.textContent = "چیزی برای کپی نیست";
      return;
    }
    navigator.clipboard.writeText(text)
      .then(() => copyStatus.textContent = "نتیجه کپی شد")
      .catch(() => copyStatus.textContent = "کپی ناموفق بود");
    setTimeout(() => copyStatus.textContent = "", 1800);
  }

  function addToHistory(input, output) {
    let history = JSON.parse(localStorage.getItem("sa_cb_history") || "[]");
    const item = { input, output, time: Date.now() };
    history = [item, ...history.filter(x => x.input !== input)].slice(0, 8);
    localStorage.setItem("sa_cb_history", JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const box = document.getElementById("historyBox");
    const list = document.getElementById("historyList");
    const history = JSON.parse(localStorage.getItem("sa_cb_history") || "[]");

    list.innerHTML = "";
    if (!history.length) {
      box.style.display = "none";
      return;
    }

    box.style.display = "block";
    history.forEach(item => {
      const div = document.createElement("div");
      div.className = "historyItem";
      div.textContent = item.input;
      div.title = item.output;
      div.onclick = () => {
        document.getElementById("eq").value = item.input;
        balance();
      };
      list.appendChild(div);
    });
  }

  document.getElementById("eq").addEventListener("keydown", (e) => {
    if (e.key === "Enter") balance();
    if (e.key === "Escape") clearAll();
  });
